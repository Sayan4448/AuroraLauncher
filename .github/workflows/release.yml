name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows (NSIS / Portable / MSI)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build (electron-vite)
        run: npm run build

      - name: Package with electron-builder (NSIS, MSI, Portable)
        run: npx electron-builder --win nsis msi portable --publish never

      - name: Upload Windows installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-launcher-windows
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error

      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
